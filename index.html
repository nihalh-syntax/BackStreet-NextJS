<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var k = "backstreet-theme-v2";
        try {
          var v = localStorage.getItem(k);
          var root = document.documentElement;
          if (v === "light") root.classList.remove("dark");
          else root.classList.add("dark");
        } catch (_) {}
      })();
    </script>
